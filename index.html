
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Something Random</title>
    <meta
        name="description"
        content="Something Random - 무엇이 나올지 모르는 랜덤 뽑기!"
    >

    <!-- 기본 테마 -->
    <link rel="stylesheet" href="style.css">

    <!-- 도감 시스템 -->
    <link rel="stylesheet" href="codex.css">

    <!-- 뽑기 효과 -->
    <link rel="stylesheet" href="effects.css">

    <!-- 업적 시스템 -->
    <link rel="stylesheet" href="achievements.css">
</head>

<body>
    <div id="app">

        <!-- ===============================
             상단 헤더
             =============================== -->
        <header class="main-header">

            <div class="logo-area">
                <h1 class="logo">SOMETHING RANDOM</h1>
                <p class="subtitle">
                    무엇이 나올지는 아무도 모른다.
                </p>
            </div>

            <!-- 업적 및 도감 버튼 -->
            <div class="header-actions">

                <button
                    type="button"
                    id="achievements-open-button"
                    class="achievements-open-button"
                    aria-label="업적 목록 열기"
                    aria-haspopup="dialog"
                    aria-controls="achievements-overlay"
                >
                    <span aria-hidden="true">🏆</span>
                    <span>업적</span>
                </button>

                <button
                    type="button"
                    id="codex-open-button"
                    class="codex-open-button"
                    aria-label="도감 열기"
                    aria-haspopup="dialog"
                    aria-controls="codex-overlay"
                >
                    <span aria-hidden="true">▤</span>
                    <span>도감</span>
                </button>

            </div>
        </header>


        <!-- ===============================
             메인 콘텐츠
             =============================== -->
        <main class="main-content">

            <!-- 뽑기 영역 -->
            <section
                id="draw-section"
                class="draw-section"
                aria-label="아이템 뽑기"
            >

                <div
                    id="result-window"
                    class="result-window"
                    aria-live="polite"
                    aria-atomic="true"
                >

                    <div
                        id="result-icon"
                        class="result-icon"
                        aria-hidden="true"
                    >
                        ❔
                    </div>

                    <h2
                        id="result-name"
                        class="result-name"
                    >
                        무엇이 나올까?
                    </h2>

                    <p
                        id="result-message"
                        class="result-message"
                    >
                        버튼을 눌러 아이템을 뽑아 보세요.
                    </p>

                    <span
                        id="result-rarity"
                        class="rarity-badge rarity-none"
                    >
                        READY
                    </span>

                </div>

                <button
                    type="button"
                    id="draw-button"
                    class="draw-button"
                >
                    뽑기
                </button>

            </section>


            <!-- 인벤토리 영역 -->
            <section
                id="inventory-section"
                class="inventory-section"
                aria-label="보유 아이템"
            >

                <div class="section-header">

                    <h2 class="section-title">
                        INVENTORY
                    </h2>

                    <div class="inventory-counts">
                        <span>
                            종류
                            <strong id="inventory-unique-count">0</strong>
                        </span>

                        <span>
                            총 보유
                            <strong id="inventory-total-count">0</strong>
                        </span>
                    </div>

                </div>

                <div
                    id="inventory-grid"
                    class="inventory-grid"
                ></div>

                <p
                    id="inventory-empty"
                    class="inventory-empty"
                >
                    아직 획득한 아이템이 없습니다.
                </p>

            </section>

        </main>

    </div>


    <!-- =================================
         도감 오버레이
         ================================= -->
    <div
        id="codex-overlay"
        class="codex-overlay"
        hidden
    >

        <section
            id="codex-panel"
            class="codex-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="codex-title"
        >

            <header class="codex-header">

                <div>
                    <h2 id="codex-title">
                        ITEM CODEX
                    </h2>

                    <p>
                        지금까지 발견한 아이템을 확인하세요.
                    </p>
                </div>

                <button
                    type="button"
                    id="codex-close-button"
                    class="codex-close-button"
                    aria-label="도감 닫기"
                >
                    ×
                </button>

            </header>


            <div
                id="codex-progress"
                class="codex-progress-area"
            >
                <span>발견한 아이템</span>

                <strong>
                    <span id="codex-discovered-count">0</span>
                    /
                    <span id="codex-total-count">0</span>
                </strong>
            </div>


            <div
                id="codex-grid"
                class="codex-grid"
            ></div>


            <p
                id="codex-empty"
                class="codex-empty"
            >
                아직 발견한 아이템이 없습니다.
                뽑기를 통해 새로운 아이템을 찾아보세요!
            </p>

        </section>

    </div>


    <!-- =================================
         업적 오버레이
         ================================= -->
    <div
        id="achievements-overlay"
        class="achievements-overlay"
        hidden
    >

        <section
            id="achievements-panel"
            class="achievements-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="achievements-title"
        >

            <!-- 업적 제목과 닫기 버튼 -->
            <header class="achievements-header">

                <div class="achievements-title-area">

                    <h2
                        id="achievements-title"
                        class="achievements-title"
                    >
                        ACHIEVEMENTS
                    </h2>

                    <p class="achievements-subtitle">
                        뽑기와 수집을 통해 다양한 업적을 달성하세요.
                    </p>

                </div>

                <button
                    type="button"
                    id="achievements-close-button"
                    class="achievements-close-button"
                    aria-label="업적 목록 닫기"
                >
                    ×
                </button>

            </header>


            <!-- 업적 달성 진행도 -->
            <section class="achievements-progress">

                <div class="achievements-progress-header">

                    <span class="achievements-progress-label">
                        달성한 업적
                    </span>

                    <strong id="achievements-progress-count">
                        0 / 12
                    </strong>

                </div>

                <div
                    id="achievements-progress-bar"
                    role="progressbar"
                    aria-label="업적 달성 진행도"
                    aria-valuemin="0"
                    aria-valuemax="12"
                    aria-valuenow="0"
                >
                    <div
                        id="achievements-progress-fill"
                    ></div>
                </div>

            </section>


            <!-- JS가 업적 카드를 표시하는 영역 -->
            <div
                id="achievements-grid"
            ></div>


            <!-- 업적이 없을 때 사용할 안내 -->
            <p
                id="achievements-empty"
                hidden
            >
                아직 표시할 업적이 없습니다.
            </p>

        </section>

    </div>


    <!-- =================================
         업적 달성 알림
         ================================= -->
    <div
        id="achievement-toast-container"
        class="achievement-toast-container"
        aria-live="polite"
        aria-atomic="false"
    ></div>


    <!-- =================================
         JavaScript
         순서를 유지해 주세요!
         ================================= -->

    <!-- 등급과 아이템 목록 -->
    <script src="rarity.js" defer></script>

    <!-- 뽑기 효과 -->
    <script src="effects.js" defer></script>

    <!-- 도감 기능 -->
    <script src="codex.js" defer></script>

    <!-- 기본 뽑기와 인벤토리 -->
    <script src="script.js" defer></script>

    <!-- 업적 기능 -->
    <script src="achievements.js" defer></script>

</body>
</html>
